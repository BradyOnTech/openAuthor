name: ci

on:
  push:
  pull_request:

jobs:
  full-gates:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Run repository checks
        run: make check

      - name: Run Python tests
        run: make test

      - name: Phase 4 hardening CLI smoke
        run: |
          tmpdir="$(mktemp -d)"
          python -m openauthor init "$tmpdir"
          cd "$tmpdir"
          python -m openauthor scene add --title "CI Scene" --summary "phase4 smoke"
          python -m openauthor check workspace --json
          python -m openauthor check performance --repeat 2 --json

      - name: Run desktop tests
        run: make test-desktop

      - name: Build desktop frontend
        run: make desktop-build

      - name: Tauri backend check
        run: make tauri-check
