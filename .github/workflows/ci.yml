name: ci

on:
  push:
  pull_request:

jobs:
  shared-gateway-quota:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: gateway/package-lock.json
      - name: Install isolated gateway and PostgreSQL dependencies
        run: |
          npm ci --prefix gateway
          brew install postgresql@17
      - name: Verify shared quotas with real local PostgreSQL and HTTP adapters
        shell: bash
        run: |
          mkdir -p gateway/test-results
          python scripts/verify_shared_gateway_limiter.py --pg-bin "$(brew --prefix postgresql@17)/bin" 2>&1 | tee gateway/test-results/shared-quota.txt
      - name: Preserve shared quota evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-gateway-quota-evidence
          path: gateway/test-results/shared-quota.txt
          if-no-files-found: error

  full-gates:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: |
            contracts/package-lock.json
            desktop/package-lock.json
            gateway/package-lock.json
            mobile/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install all JavaScript dependencies
        run: make install-js

      - name: Audit all JavaScript dependencies
        run: make js-audit

      - name: Inspect current mobile export signing configuration
        if: always()
        run: npm run build:security --prefix mobile

      - name: Run repository checks
        run: make check

      - name: Run Python tests
        run: make test

      - name: Enforce large-project performance budgets
        run: make test-scale

      - name: Verify synthetic seeded-Canon regression corpus
        run: make test-canon-eval

      - name: Verify deterministic Editorial Pass regression corpus
        run: make test-editorial-eval

      - name: Verify synthetic author workflow and recovery
        run: make test-author-workflow

      - name: Phase 4 hardening CLI smoke
        run: |
          tmpdir="$(mktemp -d)"
          python -m openauthor init "$tmpdir"
          cd "$tmpdir"
          python -m openauthor scene add --title "CI Scene" --summary "phase4 smoke"
          python -m openauthor check workspace --json
          python -m openauthor check performance --repeat 2 --json

      - name: Run desktop tests
        run: make test-desktop

      - name: Verify shared contracts, session gateway, and mobile companion
        run: make test-contracts test-gateway test-mobile

      - name: Build desktop frontend
        run: make desktop-build

      - name: Install browser for real-engine authoring verification
        run: npx --prefix desktop playwright install chromium

      - name: Browser authoring workflow against the real Python engine
        run: make test-desktop-e2e

      - name: Browser companion and offline app-shell workflow
        run: make test-mobile-e2e

      - name: Encrypted phone to desktop workflow with local simulated hosting
        run: make test-mobile-hosted-e2e

      - name: Preserve browser workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authoring-browser-evidence
          path: |
            desktop/test-results/
            mobile/test-results/
            mobile/dist/security-build.json
            mobile/.expo/hosted-e2e/security-build.json
          if-no-files-found: ignore

      - name: Tauri backend check
        run: make tauri-check

      - name: Native Tauri-to-core product flow
        run: make tauri-test
