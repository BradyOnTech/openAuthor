name: package-macos

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "openauthor/**"
      - "desktop/**"
      - "contracts/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".nvmrc"
      - ".github/workflows/package-macos.yml"

permissions:
  contents: read

jobs:
  package-smoke:
    name: Unsigned package recovery (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: make install-desktop
      - name: Build pinned runtimes on native architecture
        env:
          OPENAUTHOR_RUNTIME_ARCH: ${{ matrix.arch }}
        run: bash scripts/prepare_bundled_runtime.sh
      - name: Build unsigned app for internal testing
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          LC_CTYPE: en_US.UTF-8
        run: npm run tauri:build --prefix desktop -- --bundles app
      - name: Verify recovery without system tools
        env:
          OPENAUTHOR_EXPECT_ARCH: ${{ matrix.arch }}
          OPENAUTHOR_BUNDLE_REPORT_PATH: ${{ runner.temp }}/package-evidence.json
        run: bash scripts/verify_macos_bundle.sh
      - name: Archive internal-test application
        run: ditto -c -k --keepParent desktop/src-tauri/target/release/bundle/macos/openAuthor.app openAuthor-${{ matrix.arch }}-UNSIGNED.zip
      - name: Record archive checksum
        run: shasum -a 256 openAuthor-${{ matrix.arch }}-UNSIGNED.zip > openAuthor-${{ matrix.arch }}-UNSIGNED.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: openAuthor-${{ matrix.arch }}-UNSIGNED-internal-test
          path: |
            openAuthor-${{ matrix.arch }}-UNSIGNED.zip
            openAuthor-${{ matrix.arch }}-UNSIGNED.sha256
            ${{ runner.temp }}/package-evidence.json
          retention-days: 7
