version: 2
multi-ecosystem-groups:
  desktop:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: npm
    directory: /desktop
    patterns: ["*"]
    multi-ecosystem-group: desktop
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    patterns: ["*"]
    multi-ecosystem-group: desktop
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
