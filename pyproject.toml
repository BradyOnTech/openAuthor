[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openauthor"
version = "0.1.0"
description = "Local-first fiction authoring project engine."
requires-python = ">=3.11"
authors = [{ name = "openAuthor" }]
readme = "README.md"

[project.scripts]
openauthor = "openauthor.cli:main"
