[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openauthor"
version = "0.1.0"
description = "Local-first fiction authoring project engine."
requires-python = ">=3.11"
authors = [{ name = "openAuthor" }]
readme = "README.md"

[project.scripts]
openauthor = "openauthor.cli:main"

[tool.setuptools.packages.find]
include = ["openauthor*"]

[tool.setuptools.package-data]
openauthor = ["writing_skills/fiction-writing/*.md", "writing_skills/fiction-writing/references/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["desktop/src-tauri/resources", "desktop/src-tauri/target", "node_modules"]
