[package]
name = "openauthor-desktop"
version = "0.1.0"
description = "openAuthor desktop shell"
authors = ["openAuthor"]
edition = "2021"

[lib]
name = "openauthor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0.0", features = [] }
